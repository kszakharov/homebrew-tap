name: Bump formulae

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Custom list of formulae to livecheck and bump if outdated
        required: false
        type: string

  workflow_call:
    inputs:
      formulae:
        description: Custom list of formulae to livecheck and bump if outdated
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  autobump:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false
      - name: Set up Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Determine formulae list
        id: formulae
        shell: bash
        run: |
          if [[ -n "${{ inputs.formulae }}" ]]; then
            FORMULAE="${{ inputs.formulae }}"
          else
            FORMULAE="$(find Formula -name "*.rb" -exec basename {} .rb \; | tr "\n" " ")"
          fi
          echo "formulae=$FORMULAE" >> "$GITHUB_OUTPUT"
      - name: Bump packages
        uses: Homebrew/actions/bump-packages@main
        with:
          formulae: ${{ steps.formulae.outputs.formulae }}
          fork: false
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
